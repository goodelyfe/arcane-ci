# Builds Docker images of the fork's main and the feature branch and pushes
# them to GHCR, after each sync-and-test run. Uses the built-in GITHUB_TOKEN,
# so nothing extra is stored in GitHub or Infisical.
#
#   ghcr.io/goodelyfe/arcane:main        latest fork main (= upstream main)
#   ghcr.io/goodelyfe/arcane:infisical   latest feat/infisical
#   ...plus an immutable :<tag>-<short sha> for each build.
name: Build images

on:
  workflow_run:
    workflows: [Sync fork and test feature branch]
    types: [completed]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if an image for the current commit exists
        type: boolean
        default: false

permissions:
  contents: read

env:
  FORK: goodelyfe/arcane
  IMAGE: ghcr.io/goodelyfe/arcane

concurrency:
  group: build-images
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.branch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - branch: main
            tag: main
            # main is fast-forwarded from upstream, so it's worth building
            # even when the feature branch's rebase check failed.
            needs_green_tests: false
          - branch: feat/infisical
            tag: infisical
            needs_green_tests: true
    steps:
      - name: Decide whether to build
        id: gate
        env:
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          NEEDS_GREEN: ${{ matrix.needs_green_tests }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_run && "$NEEDS_GREEN" == true && "$RUN_CONCLUSION" != success ]]; then
            echo "Sync and test ended in '$RUN_CONCLUSION'; not building ${{ matrix.branch }}."
            echo "build=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          sha=$(git ls-remote "https://github.com/$FORK.git" "refs/heads/${{ matrix.branch }}" | cut -f1)
          [[ -n "$sha" ]] || { echo "::error::Branch ${{ matrix.branch }} not found in $FORK"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short=${sha:0:7}" >> "$GITHUB_OUTPUT"
          echo "build=true" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: steps.gate.outputs.build == 'true'
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Skip if this commit is already built
        id: existing
        if: steps.gate.outputs.build == 'true' && !inputs.force
        run: |
          if docker buildx imagetools inspect "$IMAGE:${{ matrix.tag }}-${{ steps.gate.outputs.short }}" > /dev/null 2>&1; then
            echo "Image for ${{ steps.gate.outputs.short }} already exists; skipping."
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out ${{ matrix.branch }}
        if: steps.gate.outputs.build == 'true' && steps.existing.outputs.found != 'true'
        uses: actions/checkout@v7.0.1
        with:
          repository: ${{ env.FORK }}
          ref: ${{ steps.gate.outputs.sha }}

      - name: Set up Buildx
        if: steps.gate.outputs.build == 'true' && steps.existing.outputs.found != 'true'
        uses: docker/setup-buildx-action@v4.4.1

      - name: Build and push
        if: steps.gate.outputs.build == 'true' && steps.existing.outputs.found != 'true'
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          build-args: |
            REVISION=${{ steps.gate.outputs.sha }}
          tags: |
            ${{ env.IMAGE }}:${{ matrix.tag }}
            ${{ env.IMAGE }}:${{ matrix.tag }}-${{ steps.gate.outputs.short }}
          # The source label links the package to this repo, which keeps
          # GITHUB_TOKEN allowed to push to it.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.gate.outputs.sha }}
            org.opencontainers.image.title=arcane (${{ matrix.branch }})
          cache-from: type=gha,scope=${{ matrix.tag }}
          cache-to: type=gha,scope=${{ matrix.tag }},mode=max
